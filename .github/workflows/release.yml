name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build the JAR and SBOM
        run: ./mvnw -B -DskipTests package

      - name: Locate the built artifacts
        id: artifacts
        run: |
          jar=$(find target -maxdepth 1 -name "outbreak-signal-service-*.jar" ! -name "*.original")
          sbom=target/classes/META-INF/sbom/application.cdx.json
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "sbom=$sbom" >> "$GITHUB_OUTPUT"

      # The GitHub Release itself (tag, hand-written notes) already exists
      # by the time this workflow runs — see CONTRIBUTING.md's release
      # checklist. This step attaches build artifacts to it; softprops/action-gh-release
      # updates an existing release by tag rather than replacing it, and
      # leaves the body untouched since none is given here.
      - name: Attach the JAR and SBOM to the release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            ${{ steps.artifacts.outputs.jar }}
            ${{ steps.artifacts.outputs.sbom }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the container image to GHCR
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/khalilurrrahmanridoykhan/outbreak-signal-service:${{ github.ref_name }}
            ghcr.io/khalilurrrahmanridoykhan/outbreak-signal-service:latest
