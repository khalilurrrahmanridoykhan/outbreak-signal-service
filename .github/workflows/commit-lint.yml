name: Commit lint

on:
  pull_request:

permissions:
  contents: read

jobs:
  commit-lint:
    name: commit-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject co-author trailers and assistant attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          offending=$(git log --format='%h %s%n%b' "$BASE..$HEAD" | grep -n -i -E 'co-authored-by|claude|anthropic' || true)
          if [ -n "$offending" ]; then
            echo "Commit messages must not contain co-author trailers or assistant attribution:" >&2
            echo "$offending" >&2
            exit 1
          fi
          echo "No co-author trailers or assistant attribution found."
