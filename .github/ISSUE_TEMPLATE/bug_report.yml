name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please do not include real patient
        or case-level data. For security problems, use the private reporting link on
        the issue chooser instead of this form.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or requests that shows the problem.
      placeholder: |
        1. docker compose up --build
        2. curl ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the commit hash if you built from source.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Java version, Docker version, anything else that seems relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      render: text
