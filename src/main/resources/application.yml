server:
  # Finishes in-flight HTTP requests before shutting down, instead of
  # cutting them off; paired with spring.task.scheduling's own
  # await-termination below so a mid-batch outbox poller gets the same
  # treatment, not just the web server.
  shutdown: graceful

spring:
  application:
    name: outbreak-signal-service
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      shutdown:
        await-termination: true
        await-termination-period: 30s
  datasource:
    # Defaults match docker-compose.yml and are for local development only.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outbreaksignal}
    username: ${DB_USERNAME:outbreak}
    password: ${DB_PASSWORD:outbreak}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
  mail:
    # Defaults match docker-compose.yml's Mailpit service; Mailpit accepts
    # any mail with no auth, so there is nothing to configure beyond host
    # and port for local development. A real deployment overrides these with
    # its own SMTP relay (and outbreak.notification.email.enabled=true).
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

outbreak:
  sync:
    window-weeks: ${OUTBREAK_SYNC_WINDOW_WEEKS:104}
    # Cron expression for the scheduled sync; read directly from the
    # environment by @Scheduled, not through OutbreakProperties, so it must
    # be set here explicitly (OutbreakProperties.Sync's own @DefaultValue
    # only applies when something binds that record, which @Scheduled's
    # placeholder resolution does not).
    cron: ${OUTBREAK_SYNC_CRON:0 0 3 * * *}
  dhis2:
    # Defaults point at the public DHIS2 demo instance (read-only, public
    # admin/district credentials) so a fresh clone can sync real data with no
    # setup. The base URL is the host that the play.dhis2.org/40 alias
    # resolved to as of the spike in docs/dhis2-spike.md, and will need
    # updating when that demo moves to its next patch version. None of this
    # is appropriate for a real deployment; override every one of these.
    base-url: ${DHIS2_BASE_URL:https://play.im.dhis2.org/stable-2-40-12}
    username: ${DHIS2_USERNAME:admin}
    password: ${DHIS2_PASSWORD:district}
    org-unit-level: ${DHIS2_ORG_UNIT_LEVEL:3}
    data-elements:
      - uid: UsSUX0cpKsH
        name: IDSR Cholera
      - uid: vq2qO3eTrNi
        name: IDSR Malaria
      - uid: YazgqXbizv1
        name: IDSR Measles
      - uid: HS9zqaBdOQ4
        name: IDSR Plague
      - uid: noIzB569hTM
        name: IDSR Yellow fever
  detection:
    moving-average:
      baseline-weeks: ${OUTBREAK_DETECTION_MOVING_AVERAGE_BASELINE_WEEKS:12}
      threshold-k: ${OUTBREAK_DETECTION_MOVING_AVERAGE_THRESHOLD_K:3.0}
    ears:
      baseline-weeks: ${OUTBREAK_DETECTION_EARS_BASELINE_WEEKS:7}
      threshold: ${OUTBREAK_DETECTION_EARS_THRESHOLD:3.0}
    cusum:
      baseline-weeks: ${OUTBREAK_DETECTION_CUSUM_BASELINE_WEEKS:8}
      reference-k-sigma: ${OUTBREAK_DETECTION_CUSUM_REFERENCE_K_SIGMA:0.5}
      threshold-h-sigma: ${OUTBREAK_DETECTION_CUSUM_THRESHOLD_H_SIGMA:5.0}
  security:
    # The optional local Keycloak profile's JWK endpoint (docker-compose.yml,
    # `keycloak` profile). Building the JwtDecoder from this never contacts it
    # eagerly, so the app starts fine even when that profile is not running;
    # override for a real deployment's own identity provider.
    jwk-set-uri: ${OUTBREAK_SECURITY_JWK_SET_URI:http://localhost:8081/realms/outbreak-signal/protocol/openid-connect/certs}
  notification:
    outbox:
      poll-interval-ms: ${OUTBREAK_NOTIFICATION_OUTBOX_POLL_INTERVAL_MS:5000}
      batch-size: ${OUTBREAK_NOTIFICATION_OUTBOX_BATCH_SIZE:20}
    webhook:
      poll-interval-ms: ${OUTBREAK_NOTIFICATION_WEBHOOK_POLL_INTERVAL_MS:5000}
      batch-size: ${OUTBREAK_NOTIFICATION_WEBHOOK_BATCH_SIZE:20}
      max-attempts: ${OUTBREAK_NOTIFICATION_WEBHOOK_MAX_ATTEMPTS:5}
      initial-backoff-ms: ${OUTBREAK_NOTIFICATION_WEBHOOK_INITIAL_BACKOFF_MS:10000}
      backoff-multiplier: ${OUTBREAK_NOTIFICATION_WEBHOOK_BACKOFF_MULTIPLIER:3.0}
      stale-sending-timeout-ms: ${OUTBREAK_NOTIFICATION_WEBHOOK_STALE_SENDING_TIMEOUT_MS:300000}
      request-timeout-ms: ${OUTBREAK_NOTIFICATION_WEBHOOK_REQUEST_TIMEOUT_MS:10000}
    email:
      # Off by default: a fresh clone's Mailpit is reachable, but a real
      # deployment must opt in deliberately once real recipients are set.
      enabled: ${OUTBREAK_NOTIFICATION_EMAIL_ENABLED:false}
      to: ${OUTBREAK_NOTIFICATION_EMAIL_TO:ops@example.org}
      from: ${OUTBREAK_NOTIFICATION_EMAIL_FROM:outbreak-signal@example.org}
  rate-limit:
    requests-per-minute: ${OUTBREAK_RATE_LIMIT_REQUESTS_PER_MINUTE:300}
    burst-capacity: ${OUTBREAK_RATE_LIMIT_BURST_CAPACITY:50}
  request:
    max-body-bytes: ${OUTBREAK_REQUEST_MAX_BODY_BYTES:1048576}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
