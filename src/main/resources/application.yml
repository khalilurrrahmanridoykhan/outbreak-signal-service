spring:
  application:
    name: outbreak-signal-service
  datasource:
    # Defaults match docker-compose.yml and are for local development only.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/outbreaksignal}
    username: ${DB_USERNAME:outbreak}
    password: ${DB_PASSWORD:outbreak}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

outbreak:
  sync:
    window-weeks: ${OUTBREAK_SYNC_WINDOW_WEEKS:104}
    # Cron expression for the scheduled sync; read directly from the
    # environment by @Scheduled, not through OutbreakProperties, so it must
    # be set here explicitly (OutbreakProperties.Sync's own @DefaultValue
    # only applies when something binds that record, which @Scheduled's
    # placeholder resolution does not).
    cron: ${OUTBREAK_SYNC_CRON:0 0 3 * * *}
  dhis2:
    # Defaults point at the public DHIS2 demo instance (read-only, public
    # admin/district credentials) so a fresh clone can sync real data with no
    # setup. The base URL is the host that the play.dhis2.org/40 alias
    # resolved to as of the spike in docs/dhis2-spike.md, and will need
    # updating when that demo moves to its next patch version. None of this
    # is appropriate for a real deployment; override every one of these.
    base-url: ${DHIS2_BASE_URL:https://play.im.dhis2.org/stable-2-40-12}
    username: ${DHIS2_USERNAME:admin}
    password: ${DHIS2_PASSWORD:district}
    org-unit-level: ${DHIS2_ORG_UNIT_LEVEL:3}
    data-elements:
      - uid: UsSUX0cpKsH
        name: IDSR Cholera
      - uid: vq2qO3eTrNi
        name: IDSR Malaria
      - uid: YazgqXbizv1
        name: IDSR Measles
      - uid: HS9zqaBdOQ4
        name: IDSR Plague
      - uid: noIzB569hTM
        name: IDSR Yellow fever
  detection:
    moving-average:
      baseline-weeks: ${OUTBREAK_DETECTION_MOVING_AVERAGE_BASELINE_WEEKS:12}
      threshold-k: ${OUTBREAK_DETECTION_MOVING_AVERAGE_THRESHOLD_K:3.0}
    ears:
      baseline-weeks: ${OUTBREAK_DETECTION_EARS_BASELINE_WEEKS:7}
      threshold: ${OUTBREAK_DETECTION_EARS_THRESHOLD:3.0}
    cusum:
      baseline-weeks: ${OUTBREAK_DETECTION_CUSUM_BASELINE_WEEKS:8}
      reference-k-sigma: ${OUTBREAK_DETECTION_CUSUM_REFERENCE_K_SIGMA:0.5}
      threshold-h-sigma: ${OUTBREAK_DETECTION_CUSUM_THRESHOLD_H_SIGMA:5.0}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
